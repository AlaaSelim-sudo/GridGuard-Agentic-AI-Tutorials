name: Publish tutorial site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/**'
      - 'web/**'
      - 'agentic_operator_tutorial/**'
      - 'agentic_operator_cases_tutorial/**'
      - 'agentic_grid_workflow_tutorial/**'
      - 'third_party/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the tutorial sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            agentic_operator_tutorial/slidev/pnpm-lock.yaml
            agentic_operator_cases_tutorial/slidev/pnpm-lock.yaml
      - name: Install the pinned presentation dependencies
        run: |
          pnpm --dir agentic_operator_tutorial/slidev install --frozen-lockfile
          pnpm --dir agentic_operator_cases_tutorial/slidev install --frozen-lockfile
      - name: Build both presentations and the audience home page
        run: node scripts/build-pages.mjs --base /${{ github.event.repository.name }}/
      - name: Read the Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the complete site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
